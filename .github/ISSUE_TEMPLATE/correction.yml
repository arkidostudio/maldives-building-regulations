name: Report a correction
description: Report an error in a translation, clause, calculation, checklist item or source file.
title: "Correction: "
labels: [correction]
body:
  - type: dropdown
    id: page
    attributes:
      label: Affected area
      options:
        - Guideline
        - Rules Checker
        - Checklist
        - Downloads
        - Other
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Article, clause or checklist item
      placeholder: "For example: Article 9(e)(2)"
  - type: textarea
    id: issue
    attributes:
      label: What appears to be wrong?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Supporting official source
      description: Add a link, document title, page number or short quotation where possible.
